<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дино спешит на праздник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-bleed canvas world (sky turns from day to night as Dino runs);
   DOM layers float above it: intro card, the HAPPY BIRTHDAY banner, the gift viewer. */
:root {
  --night: #1b1440;       /* page ground, late-evening plum */
  --paper: #fff7ec;       /* cards and polaroid paper */
  --paper-2: #f3e7d5;     /* key caps, quiet fills on paper */
  --paper-edge: #dcc9ae;
  --ink: #2a1b3d;         /* text on paper */
  --muted: #76668a;       /* secondary text on paper */
  --candy: #ff4f8b;       /* main action: frosting pink */
  --candy-deep: #c2245f;
  --sun: #ffc83d;         /* candle flame, focus ring */
  --leaf: #4fbf63;        /* Dino */
  --veil: rgba(18, 12, 44, .74);
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-ui: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--paper);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.layer {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}

/* ---------- intro card ---------- */
#intro { display: grid; place-items: center; z-index: 12; background: rgba(27, 20, 64, .28); }
.card {
  background: var(--paper); color: var(--ink);
  border-radius: 22px; width: 100%; max-width: 29rem; box-sizing: border-box;
  padding: 26px 26px 24px;
  box-shadow: 0 8px 0 rgba(42, 27, 61, .25), 0 30px 60px rgba(10, 5, 30, .45);
  display: grid; gap: 14px;
  animation: pop-in .5s cubic-bezier(.2, 1.4, .4, 1) both;
  max-height: 100%; overflow: auto;
}
.eyebrow { margin: 0; font: 900 .78rem/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--candy-deep); }
.card h1 { margin: 0; font: 900 clamp(1.7rem, 5.4vw, 2.35rem)/1.05 var(--font-ui); text-wrap: balance; }
.card p { margin: 0; font-size: 1.06rem; line-height: 1.45; font-weight: 700; }
.keys { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-weight: 800; color: var(--muted); font-size: .95rem; }
kbd {
  font: 900 .82rem/1 var(--font-ui); color: var(--ink);
  background: var(--paper-2); border: 2px solid var(--paper-edge); border-bottom-width: 4px;
  border-radius: 8px; padding: 5px 9px;
}
.rotate-tip { display: none; font-size: .92rem !important; color: var(--muted); }
@media (orientation: portrait) and (max-width: 700px) { .rotate-tip { display: block; } }

.btn {
  appearance: none; border: 0; cursor: pointer;
  border-radius: 16px; background: var(--candy); color: var(--paper);
  font: 900 1.12rem/1 var(--font-ui); letter-spacing: .01em;
  padding: 15px 26px;
  box-shadow: 0 6px 0 var(--candy-deep);
  transition: transform .08s, box-shadow .08s, filter .15s;
  justify-self: start;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--candy-deep); }
.btn:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px rgba(255, 247, 236, .65); }
.btn.ghost:active { transform: translateY(2px); }

/* ---------- sound toggle ---------- */
#mute {
  position: fixed; z-index: 30;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
}
.icon-btn {
  appearance: none; border: 0; cursor: pointer; padding: 0;
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(27, 20, 64, .42); color: var(--paper);
  box-shadow: inset 0 0 0 1.5px rgba(255, 247, 236, .28);
  display: grid; place-items: center;
}
.icon-btn svg { width: 24px; height: 24px; }

/* ---------- HAPPY BIRTHDAY banner ---------- */
#party {
  z-index: 10; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: clamp(6px, 1.6vh, 14px); text-align: center;
  padding-top: max(calc(env(safe-area-inset-top, 0px) + 7vh), 56px);
}
.hb {
  margin: 0; font: 400 clamp(2rem, min(10vw, 12.5vh), 7.4rem)/1 var(--font-display);
  display: flex; flex-wrap: wrap; justify-content: center; column-gap: .32em; row-gap: .05em;
}
.hb .word { display: inline-flex; white-space: nowrap; }
.hb .ch {
  display: inline-block; color: var(--c);
  text-shadow: 0 .07em 0 rgba(20, 10, 40, .55), 0 0 .45em var(--c);
  animation: drop .8s cubic-bezier(.25, 1.55, .45, 1) both, bob 2.2s ease-in-out infinite;
  animation-delay: calc(var(--i) * 75ms), calc(var(--i) * 75ms + .8s);
}
@keyframes drop { from { transform: translateY(-110vh) rotate(-25deg); } to { transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-.09em) rotate(3deg); } }
.hb-sub {
  margin: 0; font: 700 clamp(1.7rem, min(5.6vw, 8vh), 3.3rem)/1.05 var(--font-hand); color: var(--paper);
  text-shadow: 0 2px 0 rgba(20, 10, 40, .6), 0 0 18px rgba(255, 79, 139, .55);
  animation: fade-up .9s ease-out both; animation-delay: 1.4s;
}
.hb-score { margin: 0; font: 800 clamp(.9rem, 2.4vh, 1.05rem)/1.2 var(--font-ui); color: var(--paper); opacity: .9; animation: fade-up .8s ease-out both; animation-delay: 2.1s; }
#party .btn { pointer-events: auto; justify-self: center; animation: fade-up .7s ease-out both; animation-delay: 3.2s; }
.party-tip { margin: 0; font: 800 .85rem/1.2 var(--font-ui); opacity: .75; animation: fade-up .7s ease-out both; animation-delay: 4s; }
@media (max-height: 430px) { .hb-score, .party-tip { display: none; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop-in { from { opacity: 0; transform: scale(.9) translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- gift viewer (photos / videos / animated cards) ---------- */
#gift {
  z-index: 15; background: var(--veil);
  display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; align-items: center; gap: 10px;
}
.stage { display: grid; place-items: center; min-height: 0; width: 100%; height: 100%; }
.stage > .polaroid { grid-area: 1 / 1; }
.polaroid {
  background: var(--paper); color: var(--ink);
  padding: 10px 10px 0; border-radius: 5px;
  box-shadow: 0 18px 40px rgba(5, 2, 20, .55);
  transform: rotate(var(--tilt, -1.5deg));
  display: grid; justify-items: center;
  max-width: 100%; box-sizing: border-box;
  animation: slide-in .55s cubic-bezier(.2, 1.25, .4, 1) both;
}
.polaroid.out { animation: slide-out .3s ease-in both; pointer-events: none; }
@keyframes slide-in { from { opacity: 0; transform: translateY(30px) scale(.9) rotate(calc(var(--tilt, 0deg) * 4)); } to { opacity: 1; transform: rotate(var(--tilt, 0deg)); } }
@keyframes slide-out { to { opacity: 0; transform: translateY(-20px) scale(.95) rotate(var(--tilt, 0deg)); } }
.media { overflow: hidden; background: #efe3d0; display: grid; place-items: center; line-height: 0; max-width: 100%; }
.media img, .media video {
  display: block; width: auto; height: auto;
  max-width: min(84vw, 920px); max-height: calc(100vh - 235px); min-height: 0;
}
@media (max-height: 520px) { .media img, .media video { max-height: calc(100vh - 150px); } }
.media img.kb { animation: kb var(--dur, 5s) ease-out both; transform-origin: var(--ox, 50%) var(--oy, 50%); }
@keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.08); } }
.media canvas { display: block; max-width: 100%; }
.caption {
  margin: 0; padding: 8px 8px 12px; min-height: 1.1em; max-width: 100%;
  font: 700 clamp(1.4rem, 3.4vh, 2rem)/1.05 var(--font-hand); color: var(--ink); text-align: center; text-wrap: balance;
}
.caption-sub { display: block; margin-top: 3px; font-size: .74em; color: var(--muted); }
.gift-nav { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.gift-nav .icon-btn { background: rgba(255, 247, 236, .14); }
.dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; max-width: 60vw; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 247, 236, .3); transition: background .2s, transform .2s; }
.dots i.on { background: var(--sun); transform: scale(1.25); }
.end-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
#unmuteVideo { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); justify-self: center; font-size: .95rem; padding: 11px 18px; }
.media-wrap { position: relative; }

@media (prefers-reduced-motion: reduce) {
  .hb .ch { animation: fade-up .6s ease-out both; animation-delay: calc(var(--i) * 40ms); }
  .media img.kb { animation: none; }
}
</style>
</head>
<body>
<canvas id="game" aria-label="Игра: динозаврик бежит к праздничному торту" tabindex="-1"></canvas>

<button id="mute" class="icon-btn" type="button" aria-label="Выключить звук" title="Звук">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>
    <path class="waves" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>
    <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/>
  </svg>
</button>

<div id="intro" class="layer">
  <div class="card" role="dialog" aria-labelledby="introTitle">
    <p class="eyebrow">Игра-открытка</p>
    <h1 id="introTitle">Дино спешит на праздник</h1>
    <p>Динозаврик бежит сам. Помоги ему перепрыгнуть все ямки и добраться до праздничного торта!</p>
    <div class="keys"><span>Прыжок:</span><kbd>Касание</kbd><kbd>Клик</kbd><kbd>Пробел</kbd></div>
    <p class="rotate-tip">Поверни телефон боком, так играть удобнее.</p>
    <button id="startBtn" class="btn" type="button">Начать</button>
  </div>
</div>

<div id="party" class="layer" hidden>
  <h1 class="hb" id="hb" aria-label="HAPPY BIRTHDAY!"></h1>
  <p class="hb-sub" id="hbSub"></p>
  <p class="hb-score" id="hbScore"></p>
  <button id="giftBtn" class="btn" type="button">Открыть подарок</button>
  <p class="party-tip">Нажми на небо, чтобы запустить салют</p>
</div>

<div id="gift" class="layer" hidden>
  <div class="stage" id="stage"></div>
  <div class="gift-nav" id="giftNav">
    <button id="prevBtn" class="icon-btn" type="button" aria-label="Предыдущая">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="dots" id="dots"></div>
    <button id="nextBtn" class="icon-btn" type="button" aria-label="Следующая">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   НАСТРОЙКИ — всё, что можно поменять под себя, собрано здесь.
   ===================================================================== */
const CONFIG = {
  title: 'HAPPY BIRTHDAY!',
  subtitle: 'С днём рождения, мама!',

  // Таблички, мимо которых пробегает динозаврик (по порядку).
  signs: ['Мама, ты лучшая!', 'Спасибо за всё!', 'Ты самая любимая', 'Праздник уже близко!'],

  // Фото и видео для финала. Положи файлы в папку photos рядом с этим файлом
  // и назови их по порядку: 1.jpg, 2.png, 3.gif, 4.mp4 ... (jpg, png, gif, webp, mp4, webm).
  // Фото с iPhone в формате HEIC сначала сохрани как JPG, видео .MOV лучше перевести в MP4.
  photosFolder: 'photos/',
  // Или перечисли файлы явно, тогда папка не просматривается:
  // photos: ['photos/море.jpg', 'photos/танец.mp4'],
  photos: [],
  // Подписи к фото по порядку (можно оставить пустыми).
  captions: [],
  // Сколько секунд показывать одну картинку (видео играет до конца).
  slideSeconds: 5,

  // Музыка для финала. Если файла нет, сыграет встроенная мелодия «Happy Birthday».
  music: 'music.mp3',

  candles: 5,
  finalWish: 'Пусть всё задуманное сбудется!',
};

/* ===================================================================== */

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const TAU = Math.PI * 2;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function heartPath(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + 0.55 * s);
  c.bezierCurveTo(x - 1.15 * s, y - 0.05 * s, x - 0.6 * s, y - 1.0 * s, x, y - 0.38 * s);
  c.bezierCurveTo(x + 0.6 * s, y - 1.0 * s, x + 1.15 * s, y - 0.05 * s, x, y + 0.55 * s);
  c.closePath();
}
function seeded(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const TOUCH = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

/* =====================================================================
   SOUND — everything is synthesized with WebAudio, no files needed.
   ===================================================================== */
const Sound = (() => {
  let ctx = null, master = null, sfx = null, musicBus = null, noiseBuf = null;
  let muted = false; // not saved: a mute left on while testing must not silence the gift
  let fwVol = 1;

  function init() {
    try {
      if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
    } catch (e) { /* not supported */ }
    if (ctx) { if (ctx.state !== 'running' && ctx.state !== 'closed') ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.2;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(comp);
    sfx = ctx.createGain(); sfx.gain.value = 0.7; sfx.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
    const len = Math.floor(ctx.sampleRate * 2);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  }
  const ok = () => ctx && ctx.state !== 'closed';
  const now = () => ctx.currentTime;

  function envelope(g, t0, attack, peak, decay) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  }
  function tone(type, f0, t0, dur, peak, dest, f1, attack = 0.006, pan = null) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    envelope(g, t0, attack, peak, dur);
    o.connect(g);
    connectPan(g, dest, pan);
    o.start(t0); o.stop(t0 + attack + dur + 0.05);
  }
  function connectPan(node, dest, pan) {
    if (pan != null && ctx.createStereoPanner) {
      const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
      node.connect(p); p.connect(dest);
    } else node.connect(dest);
  }
  function noise(t0, dur, peak, ftype, f0, f1, q, dest, attack = 0.004, pan = null) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = ctx.createGain(); envelope(g, t0, attack, peak, dur);
    s.connect(f); f.connect(g); connectPan(g, dest, pan);
    s.start(t0, Math.random() * 1.2); s.stop(t0 + attack + dur + 0.05);
  }
  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const api = {
    init,
    get muted() { return muted; },
    setMuted(m) {
      muted = m;
      if (ok()) master.gain.setTargetAtTime(m ? 0 : 0.9, now(), 0.03);
    },
    setFireworkVolume(v) { fwVol = v; },
    suspend() { if (ok() && ctx.state === 'running') ctx.suspend().catch(() => {}); },
    resume() { if (ok() && ctx.state !== 'running') ctx.resume().catch(() => {}); }, // iOS also has 'interrupted'
    jump() { if (!ok()) return; const t = now(); tone('square', 330, t, 0.13, 0.07, sfx, 700); tone('triangle', 660, t, 0.1, 0.06, sfx, 1100); },
    land() { if (!ok()) return; noise(now(), 0.06, 0.08, 'lowpass', 500, 200, 0.7, sfx); },
    heart() { if (!ok()) return; const t = now(); tone('sine', 988, t, 0.12, 0.16, sfx); tone('sine', 1480, t + 0.07, 0.28, 0.14, sfx); },
    splash() {
      if (!ok()) return; const t = now();
      noise(t, 0.55, 0.32, 'lowpass', 2200, 300, 0.8, sfx, 0.01);
      tone('sine', 520, t + 0.02, 0.32, 0.16, sfx, 110);
    },
    ready() { if (!ok()) return; const t = now(); tone('triangle', midi(72), t, 0.12, 0.1, sfx); tone('triangle', midi(76), t + 0.09, 0.18, 0.1, sfx); },
    bridge() { if (!ok()) return; const t = now(); [72, 76, 79, 84, 88].forEach((m, i) => tone('sine', midi(m), t + i * 0.06, 0.3, 0.1, sfx)); },
    pop() { if (!ok()) return; const t = now(); tone('sine', 700, t, 0.12, 0.25, sfx, 140); noise(t, 0.08, 0.15, 'highpass', 2500, null, 0.7, sfx); },
    whoosh() { if (!ok()) return; noise(now(), 0.9, 0.3, 'bandpass', 900, 260, 1.2, sfx, 0.12); },
    coins(n = 12, spread = 1.3) {
      if (!ok()) return; const t0 = now();
      for (let i = 0; i < n; i++) {
        const at = t0 + (i === 0 ? 0 : Math.random() * spread), k = rand(0.94, 1.08);
        tone('square', 988 * k, at, 0.06, 0.03, sfx);
        tone('square', 1319 * k, at + 0.06, 0.22, 0.03, sfx);
      }
    },
    chime() { if (!ok()) return; const t = now(); [79, 83, 86, 91].forEach((m, i) => tone('sine', midi(m), t + i * 0.08, 0.7, 0.1, sfx)); },

        [6, 67, .75], [6.75, 67, .25], [7, 69, 1], [8, 67, 1], [9, 74, 1], [10, 72, 2],
        [12, 67, .75], [12.75, 67, .25], [13, 79, 1], [14, 76, 1], [15, 72, 1], [16, 71, 1], [17, 69, 2],
        [19, 77, .75], [19.75, 77, .25], [20, 76, 1], [21, 72, 1], [22, 74, 1], [23, 72, 3],
      ];
      // bars: [startBeat, bassMidi, chordMidis, beatsInBar]
      const BARS = [
        [1, 48, [52, 55, 60], 3], [4, 43, [53, 59, 62], 3], [7, 43, [53, 59, 62], 3], [10, 48, [52, 55, 60], 3],
        [13, 48, [52, 58, 60], 3], [16, 41, [57, 60, 65], 4], [20, 43, [52, 55, 60], 3], [23, 48, [52, 55, 60], 3],
      ];
      const events = [];
      MEL.forEach(([b, m, l]) => events.push({ b, m, l, k: 'mel' }));
      BARS.forEach(([b, bass, ch, n]) => {
        events.push({ b, m: bass, l: 1, k: 'bass' });
        for (let i = 1; i < n; i++) events.push({ b: b + i, m: ch, l: 1, k: 'chord' });

        const len = ev.l * beat;

          tone('sine', midi(ev.m) * 2.003, at, 0.35, 0.05, gain);
          tone('triangle', midi(ev.m), at, Math.max(0.3, len * 1.1), 0.07, gain);

          tone('triangle', midi(ev.m), at, 0.5, 0.2, gain);

        if (!ok()) return;

        while (true) {
          const ev = events[idx];

          if (at > horizon) break;

        start(delay = 0) {

        stop() {
          if (timer) clearInterval(timer); timer = null;

          gain = null;
        },
        duck(on) { if (gain && ok()) gain.gain.setTargetAtTime(on ? 0.0001 : 1, ctx.currentTime, 0.15); },
        get playing() { return !!timer; },
      };
    })(),
  };

})();

/* Background music: music.mp3 if it exists, otherwise the synthesized melody. */
const Music = (() => {
  const el = new Audio();
  el.loop = true; el.preload = 'auto'; el.volume = 0.6;
  let fileState = 'unknown'; // 'ok' | 'missing' | 'unknown'
  let mode = null;            // 'file' | 'synth' | null
  let ducked = false, wantPlay = false;
  el.addEventListener('canplay', () => { fileState = 'ok'; });
  el.addEventListener('error', () => {
    fileState = 'missing';
    if (mode === 'file') fallBack();
  });
  function fallBack() {
    mode = 'synth';
    if (wantPlay) { Sound.melody.start(); if (ducked) Sound.melody.duck(true); }
  }
  if (CONFIG.music) el.src = CONFIG.music; else fileState = 'missing';
  el.muted = Sound.muted;

  return {
    // iOS only lets a media element play with sound if play() was first called inside a tap.
    bless() {
      if (fileState === 'missing' || el.dataset.blessed) return;
      el.dataset.blessed = '1';
      const p = el.play(); el.pause();
      if (p && p.catch) p.catch(() => {});
    },
    start() {
      wantPlay = true;
      if (fileState !== 'missing') {
        mode = 'file';
        el.currentTime = 0; el.muted = Sound.muted;
        const p = el.play();
        if (p && p.catch) p.catch((err) => {
          if (err && err.name === 'AbortError') return; // we paused it ourselves (video slide, hidden tab)
          if (mode === 'file') fallBack();
        });
      } else {
        mode = 'synth'; Sound.melody.start(0.2);
      }
    },
    stop() {
      wantPlay = false; ducked = false;
      el.pause(); Sound.melody.stop(); mode = null;
    },
    duck(on) {
      ducked = on;
      if (mode === 'file') { if (on) el.pause(); else if (wantPlay) el.play().catch(() => {}); }
      else if (mode === 'synth') Sound.melody.duck(on);
    },
    setMuted(m) { el.muted = m; },
    pauseForHidden() { if (mode === 'file') el.pause(); },
    resumeFromHidden() { if (mode === 'file' && wantPlay && !ducked) el.play().catch(() => {}); },
  };
})();

/* =====================================================================
   PHOTOS — look for photos/1.jpg, photos/2.mp4 ... next to this file.
   ===================================================================== */
const IMG_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
const VID_EXT = ['mp4', 'webm', 'mov'];
function probeImage(src) {
  return new Promise((res) => {
    const im = new Image(); let done = false;
    const fin = (v) => { if (!done) { done = true; res(v); } };
    im.onload = () => fin(im.naturalWidth > 0 ? { kind: 'image', src } : null);
    im.onerror = () => fin(null);
    setTimeout(() => fin(null), 6000);
    im.src = src;
  });
}
function probeVideo(src) {
  return new Promise((res) => {
    const v = document.createElement('video'); let done = false;
    const fin = (val) => { if (!done) { done = true; v.removeAttribute('src'); try { v.load(); } catch (e) {} res(val); } };
    v.preload = 'metadata'; v.muted = true;
    v.onloadedmetadata = () => fin({ kind: 'video', src });
    v.onerror = () => fin(null);
    setTimeout(() => fin(null), 6000);
    v.src = src;
  });
}
const kindOf = (src) => /^data:video\//i.test(src) || /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(src) ? 'video' : 'image';
async function probeIndex(base, exts) {
  const tries = await Promise.all([
    ...exts.img.map((e) => probeImage(base + e)),
    ...exts.vid.map((e) => probeVideo(base + e)),
  ]);
  return tries.find(Boolean) || null;
}
const MediaFinder = {
  list: null,     // final list, once the search is over
  found: [],      // what has been found so far
  promise: null,
  find() {
    if (this.promise) return this.promise;
    this.promise = (async () => {
      if (Array.isArray(CONFIG.photos) && CONFIG.photos.length) {
        this.list = CONFIG.photos.map((p) => typeof p === 'string' ? { kind: kindOf(p), src: p } : { kind: p.kind || kindOf(p.src), src: p.src });
        this.found = this.list;
        return this.list;
      }
      if (!CONFIG.photosFolder) { this.list = []; return this.list; }
      const out = this.found;
      const lower = { img: IMG_EXT, vid: VID_EXT };
      const upper = { img: IMG_EXT.map((e) => e.toUpperCase()), vid: VID_EXT.map((e) => e.toUpperCase()) };
      let misses = 0;
      for (let i = 1; i <= 80 && misses < 3; i++) {
        const base = CONFIG.photosFolder + i + '.';
        const hit = (await probeIndex(base, lower)) || (await probeIndex(base, upper));
        if (hit) { out.push(hit); misses = 0; } else misses++;
      }
      this.list = out;
      return out;
    })();
    return this.promise;
  },
};

        for (let k = 0; k <= 10; k++) {
          const py = cy - 28 - k * 4 * (0.6 + age);
          const px = cx + Math.sin(k * 0.9 + age * 4 + i) * (2 + k * 0.6);
          if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
        }
        c.stroke();
      }
    }
  }
  c.restore();
}

// Winking smiley sending a heart. (x, y) = center, r = radius.
function drawWinky(c, x, y, r, t, wink, tilt) {
  c.save(); c.translate(x, y); c.rotate(tilt || 0);
  const g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#fff1a1'); g.addColorStop(0.55, '#ffd23f'); g.addColorStop(1, '#f5a623');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,111,145,.45)';
  c.beginPath(); c.ellipse(-r * 0.56, r * 0.18, r * 0.17, r * 0.11, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(r * 0.56, r * 0.18, r * 0.17, r * 0.11, 0, 0, TAU); c.fill();
  const eye = (ex) => {
    c.fillStyle = '#4a2a12'; c.beginPath(); c.ellipse(ex, -r * 0.2, r * 0.11, r * 0.17, 0, 0, TAU); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(ex + r * 0.03, -r * 0.27, r * 0.04, 0, TAU); c.fill();
  };
  eye(-r * 0.33);
  if (wink) {
    c.strokeStyle = '#4a2a12'; c.lineWidth = r * 0.08; c.lineCap = 'round';
    c.beginPath(); c.arc(r * 0.33, -r * 0.1, r * 0.15, 1.15 * Math.PI, 1.85 * Math.PI); c.stroke();
  } else eye(r * 0.33);
  // grin with a tongue
  c.beginPath(); c.moveTo(-r * 0.46, r * 0.12); c.quadraticCurveTo(0, r * 0.82, r * 0.46, r * 0.12); c.quadraticCurveTo(0, r * 0.32, -r * 0.46, r * 0.12); c.closePath();
  c.fillStyle = '#6b2a17'; c.fill();
  c.save(); c.clip(); c.fillStyle = '#ff6f91'; c.beginPath(); c.ellipse(r * 0.06, r * 0.46, r * 0.18, r * 0.09, 0, 0, TAU); c.fill(); c.restore();
  // heart by the mouth, like a blown kiss
  const pul = 1 + Math.sin(t * 7) * 0.08;
  c.save(); c.translate(r * 0.86, r * 0.5); c.rotate(0.28);
  heartPath(c, 0, 0, r * 0.36 * pul);
  c.lineWidth = r * 0.06; c.strokeStyle = '#ffffff'; c.lineJoin = 'round'; c.stroke();
  c.fillStyle = '#ff3f7f'; c.fill();
  c.restore();
  c.restore();
}

function drawCoin(c, x, y, r, ph) {
  const sx = Math.max(0.12, Math.abs(Math.cos(ph)));
  c.save(); c.translate(x, y); c.scale(sx, 1);
  const g = c.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, '#fff3a6'); g.addColorStop(0.5, '#ffc928'); g.addColorStop(1, '#e89a00');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
  c.lineWidth = r * 0.14; c.strokeStyle = '#c98400'; c.stroke();
  c.lineWidth = r * 0.1; c.strokeStyle = 'rgba(255,236,150,.9)'; c.beginPath(); c.arc(0, 0, r * 0.62, 0, TAU); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.75)'; rr(c, -r * 0.12, -r * 0.42, r * 0.24, r * 0.84, r * 0.12); c.fill();
  c.restore();
}

function drawGiftBox(c, x, y, w, h, color, ribbon, lidOff) {
  c.fillStyle = color; rr(c, x - w / 2, y - h, w, h, 3); c.fill();
  c.fillStyle = ribbon; c.fillRect(x - w * 0.09, y - h, w * 0.18, h);
  if (!lidOff) {
    c.fillStyle = color; rr(c, x - w * 0.56, y - h - h * 0.24, w * 1.12, h * 0.26, 3); c.fill();
    c.fillStyle = ribbon; c.fillRect(x - w * 0.09, y - h - h * 0.24, w * 0.18, h * 0.26);
    c.beginPath(); c.ellipse(x - w * 0.16, y - h - h * 0.3, w * 0.16, h * 0.11, -0.5, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(x + w * 0.16, y - h - h * 0.3, w * 0.16, h * 0.11, 0.5, 0, TAU); c.fill();
  }
}

function press() {

canvas.addEventListener('pointerdown', (e) => {

// iOS unlocks audio on touchend/click rather than pointerdown, so resume on every pointerup too.

window.addEventListener('keydown', (e) => {
  const k = e.key;
  const isJump = k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'ц' || k === 'Ц';

});

/* =====================================================================
   PHYSICS
   ===================================================================== */
function overlapX(s, x) { return x + HALF_W > s.x0 && x - HALF_W < s.x1; }
function allSurfaces() { return [LEVEL.solids, LEVEL.floats, G.bridges]; }
function surfaceUnder(x, y) {
  for (const list of allSurfaces()) for (const s of list) if (overlapX(s, x) && Math.abs(s.y - y) < 0.6) return s;
  return null;
}
function landingSurface(x, prevY, y) {
  let best = null;
  for (const list of allSurfaces()) for (const s of list) {
    if (!overlapX(s, x)) continue;
    if (prevY <= s.y + 0.6 && y >= s.y) { if (!best || s.y < best.y) best = s; }
  }
  return best;
}

function onLand(surf) {
  const d = G.dino;
  d.sq = 0.8;
  dust(d.x - 6, d.y, 5);
  if (surf.solid && surf.x1 - surf.x0 >= 300) G.checkpoint = surf;
}

function step(h) {
  const d = G.dino;
  const running = G.state === 'run' || G.state === 'arrive';
  d.coyote = Math.max(0, d.coyote - h);
  G.jumpBuf = Math.max(0, G.jumpBuf - h);

  // jump
  if (G.state === 'run' && G.jumpBuf > 0 && (d.onGround || d.coyote > 0)) {
    d.vy = -JUMP_V; d.onGround = false; d.coyote = 0; G.jumpBuf = 0;
    d.sq = 1.18;
    Sound.jump();
    dust(d.x - 8, d.y, 4);
  }

  // horizontal
  let spd = 0;
  if (G.state === 'run') spd = SPEED;
  else if (G.state === 'arrive') {
    const left = LEVEL.stopX - d.x;
    spd = SPEED * Math.sqrt(clamp(left / (LEVEL.stopX - LEVEL.arriveX), 0, 1));
    if (left <= 2 || spd < 12) { d.x = LEVEL.stopX; spd = 0; startParty(); }
  }
  d.blocked = false;
  if (spd > 0) {
    let nx = d.x + spd * h;
    for (const s of LEVEL.solids) {
      if (d.x + HALF_W <= s.x0 + 0.001 && nx + HALF_W > s.x0 && d.y > s.y) {
        const below = d.y - s.y;
        if ((d.onGround && below <= STEP_TOL) || (!d.onGround && below <= LEDGE && d.vy > -200)) {
          d.y = s.y; d.vy = 0;
          if (!d.onGround) { d.onGround = true; onLand(s); }
        } else {
          nx = s.x0 - HALF_W - 0.01; d.blocked = true;
        }
      }
    }
    d.x = nx;
  }
  if (d.blocked && d.onGround) d.blockedT += h; else d.blockedT = 0;

  // vertical
  const prevY = d.y;
  if (!d.onGround) {
    d.vy += GRAV * h;
    d.y += d.vy * h;
    if (d.vy >= 0) {
      const s = landingSurface(d.x, prevY, d.y);
      if (s) {
        d.y = s.y; d.vy = 0; d.onGround = true; d.surf = s;
        onLand(s);
        if (running) Sound.land();
      }
    }
  } else {
    const s = surfaceUnder(d.x, d.y);
    if (!s) { d.onGround = false; d.coyote = G.state === 'run' ? COYOTE : 0; d.vy = 0; }
    else {
      if (s !== d.surf && s.solid && s.x1 - s.x0 >= 300) G.checkpoint = s;
      d.surf = s;
    }
  }

  // arrive at the party
  if (G.state === 'run' && d.onGround && d.x >= LEVEL.arriveX) G.state = 'arrive';

  // fell in the water
  if ((G.state === 'run' || G.state === 'arrive') && d.y > WATER_Y + 8) {
    G.state = 'fall'; G.fallT = 0;
    splash(d.x, WATER_Y);
    Sound.splash();
  }
}

function respawn() {
  const cp = G.checkpoint || LEVEL.solids[0];
  const key = LEVEL.solids.indexOf(cp);
  const n = (G.falls.get(key) || 0) + 1;
  G.falls.set(key, n);
  resetDino();
  const d = G.dino;
  d.x = cp === LEVEL.solids[0] ? 700 : Math.min(cp.x0 + 70, cp.x1 - 120);
  d.y = cp.y; d.surf = cp;
  G.camX = d.x - view.vw * 0.28;
  G.state = 'ready';
  if (n >= 2 && !G.bridges.some((b) => b.key === key)) {
    const next = LEVEL.solids.find((s) => s.x0 >= cp.x1);
    if (next) {
      G.bridges.push({ x0: cp.x1 - 4, x1: next.x0 + 4, y: cp.y, kind: 'balloon', key, born: null });
      G.bubble = { text: 'Впереди мостик из шариков!', t: G.T, dur: 99, keep: true };
      Sound.bridge();
      return;
    }
  }
  G.bubble = { text: 'Бульк! Нажми, чтобы бежать дальше', t: G.T, dur: 99 };
  Sound.ready();
}

/* =====================================================================
   PARTICLES (world space): dust, splash, sparkles
   ===================================================================== */
function dust(x, y, n) {
  for (let i = 0; i < n; i++) G.parts.push({ x, y: y - 2, vx: rand(-60, 10), vy: rand(-50, -10), life: rand(0.3, 0.5), max: 0.5, r: rand(3, 6), kind: 'dust' });
}
function splash(x, y) {
  for (let i = 0; i < 26; i++) G.parts.push({ x: x + rand(-10, 10), y, vx: rand(-110, 110), vy: rand(-330, -120), life: rand(0.5, 0.9), max: 0.9, r: rand(2.5, 5), kind: 'drop', g: 900 });
}
function sparkle(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU;
    G.parts.push({ x, y, vx: Math.cos(a) * rand(70, 140), vy: Math.sin(a) * rand(70, 140), life: 0.5, max: 0.5, r: rand(2, 3.5), kind: 'spark', color });
  }
}
function updateParts(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.g) p.vy += p.g * dt;
    if (p.kind === 'dust') { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.kind === 'spark') { p.vx *= 0.9; p.vy *= 0.9; }
  }
}

/* =====================================================================
   FIREWORKS (screen space, CSS pixels)
   ===================================================================== */
const FX = (() => {
  const rockets = [], parts = [], confetti = [];
  let flash = 0;
  const PAL = [
    ['#ff4f8b', '#ff9ec0'], ['#ffd44d', '#fff1a8'], ['#5fd0ff', '#c4f0ff'], ['#9b7bff', '#d9ccff'],
    ['#6ee07a', '#c8f7c8'], ['#ff8a3d', '#ffd0a8'], ['#ffffff', '#ffe9b0'],
  ];
  const U = () => Math.min(view.cssW, view.cssH) / 600;

  function launch(o = {}) {
    const W = view.cssW, H = view.cssH, u = U();
    const x = o.x != null ? o.x : rand(W * 0.1, W * 0.9);
    const ty = o.ty != null ? o.ty : rand(H * 0.1, H * 0.42);
    const sy = H + 10;
    const g = 320 * u;
    const vy = -Math.sqrt(2 * g * Math.max(40, sy - ty));
    const type = o.type || pick(['peony', 'peony', 'ring', 'heart', 'willow', 'crackle', 'double']);
    rockets.push({ x: x + rand(-30, 30) * u, y: sy, vx: rand(-14, 14) * u, vy, g, type, pal: o.pal || pick(PAL), small: !!o.small, big: !!o.big, trailT: 0 });
    if (!o.small) Sound.launch(clamp((x / W) * 2 - 1, -1, 1) * 0.7);
  }
  function burst(r) {
    const u = U() * (r.small ? 0.45 : 1) * (r.big ? 1.15 : 1);
    const [c1, c2] = r.pal;
    const add = (vx, vy, o = {}) => {
      parts.push({ x: r.x, y: r.y, vx, vy, life: o.life || rand(1.1, 1.7), max: o.life || 1.7, c: Math.random() < 0.7 ? c1 : c2, w: (o.w || 2.4) * Math.max(0.7, U()) * (r.small ? 0.7 : 1), drag: o.drag || 1.5, g: (o.g || 90) * u, tw: o.tw || 0, crack: o.crack || 0, seed: Math.random() * 10 });
    };
    const n = r.small ? 40 : 90;
    if (r.type === 'ring') {
      const sp = 210 * u;
      for (let i = 0; i < n; i++) { const a = (i / n) * TAU; add(Math.cos(a) * sp, Math.sin(a) * sp * 0.9); }
    } else if (r.type === 'heart') {
      const sp = 13 * u;
      for (let i = 0; i < n; i++) {
        const t = (i / n) * TAU;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        add(hx * sp, hy * sp, { g: 40, life: 1.6, drag: 1.3 });
      }
      r.pal = ['#ff4f8b', '#ff9ec0'];
    } else if (r.type === 'willow') {
      for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = rand(80, 190) * u; add(Math.cos(a) * sp, Math.sin(a) * sp, { life: rand(2.2, 3), drag: 1.1, g: 70, w: 1.8, tw: 1 }); }
    } else if (r.type === 'crackle') {
      for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = rand(110, 220) * u; add(Math.cos(a) * sp, Math.sin(a) * sp, { crack: rand(0.45, 0.8) }); }
      Sound.crackle(clamp((r.x / view.cssW) * 2 - 1, -1, 1) * 0.7);
    } else if (r.type === 'double') {
      for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = rand(170, 230) * u; add(Math.cos(a) * sp, Math.sin(a) * sp); }
      const keep = r.pal; r.pal = pick(PAL);
      for (let i = 0; i < n / 2; i++) { const a = Math.random() * TAU, sp = rand(50, 100) * u; add(Math.cos(a) * sp, Math.sin(a) * sp); }
      r.pal = keep;
    } else {
      for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = (0.55 + 0.45 * Math.sqrt(Math.random())) * 230 * u; add(Math.cos(a) * sp, Math.sin(a) * sp, { tw: Math.random() < 0.3 ? 1 : 0 }); }
    }
    if (!r.small) {
      if (!reduceMotion) flash = Math.min(0.35, flash + 0.18);
      Sound.boom(clamp((r.x / view.cssW) * 2 - 1, -1, 1) * 0.7, r.big ? 1.15 : 0.85);
    }
    if (parts.length > 1800) parts.splice(0, parts.length - 1800);
  }
  function confettiBurst(n = 140) {
    const W = view.cssW;
    const cols = ['#ff4f8b', '#ffd44d', '#5fd0ff', '#6ee07a', '#9b7bff', '#ff8a3d', '#ffffff'];
    for (let i = 0; i < n; i++) {
      confetti.push({ x: rand(0, W), y: rand(-view.cssH * 0.6, -10), vx: rand(-30, 30), vy: rand(60, 160), rot: rand(0, TAU), vr: rand(-6, 6), w: rand(6, 11), h: rand(3, 6), c: pick(cols), ph: rand(0, TAU), life: 9 });
    }
  }
  function update(dt) {
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.vy += r.g * dt; r.x += r.vx * dt; r.y += r.vy * dt;
      r.trailT -= dt;
      if (r.trailT <= 0) {
        r.trailT = 0.016;
        parts.push({ x: r.x, y: r.y, vx: rand(-15, 15), vy: rand(10, 50), life: 0.4, max: 0.4, c: '#ffd9a0', w: 1.6, drag: 2, g: 40, tw: 0, crack: 0, seed: 0 });
      }
      if (r.vy >= -20) { burst(r); rockets.splice(i, 1); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.crack && p.life < p.max - p.crack) {
        p.crack = 0;
        for (let k = 0; k < 3; k++) parts.push({ x: p.x, y: p.y, vx: rand(-40, 40), vy: rand(-40, 40), life: 0.18, max: 0.18, c: '#ffffff', w: 1.6, drag: 3, g: 0, tw: 0, crack: 0, seed: 0 });
        p.life = Math.min(p.life, 0.05);
      }
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      const k = Math.exp(-p.drag * dt);
      p.vx *= k; p.vy *= k; p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = confetti.length - 1; i >= 0; i--) {
      const q = confetti[i];
      q.life -= dt; q.ph += dt * 4;
      q.x += (q.vx + Math.sin(q.ph) * 40) * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
      if (q.life <= 0 || q.y > view.cssH + 20) confetti.splice(i, 1);
    }

})();

/* =====================================================================
   PARTY (end of level)

function buildBanner() {
  const hb = $('#hb');
  hb.textContent = '';
  const cols = ['#ff4f8b', '#ffd44d', '#6ee07a', '#5fd0ff', '#ff8a3d', '#c3a6ff'];
  let i = 0;
  CONFIG.title.split(' ').forEach((word) => {
    const w = document.createElement('span'); w.className = 'word';
    for (const ch of word) {
      const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch;
      s.style.setProperty('--i', i); s.style.setProperty('--c', cols[i % cols.length]);
      s.setAttribute('aria-hidden', 'true');
      w.appendChild(s); i++;
    }
    hb.appendChild(w);
  });
  hb.setAttribute('aria-label', CONFIG.title);
  $('#hbSub').textContent = CONFIG.subtitle;
}
function heartsWord(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'сердечко';
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'сердечка';
  return 'сердечек';
}
function startParty() {
  if (G.state === 'party') return;
  G.state = 'party';
  G.partyT = 0;
  G.autoFw = 0.25;
  G.bubble = null;
  Sound.fanfare();
  Sound.applause(2.8);
  FX.confettiBurst(reduceMotion ? 50 : 160);
  setTimeout(() => {
    buildBanner();
    const score = $('#hbScore');
    score.hidden = G.hearts === 0;
    score.textContent = G.hearts === G.totalHearts
      ? `Ты собрала все ${G.totalHearts} ${heartsWord(G.totalHearts)}!`
      : `Ты собрала ${G.hearts} ${heartsWord(G.hearts)} из ${G.totalHearts}`;
    $('#party').hidden = false;
  }, 350);
  setTimeout(() => { if (G.state === 'party') Music.start(); }, 1500);
  MediaFinder.find();
}
function updateParty(dt) {
  G.partyT += dt;
  G.autoFw -= dt;
  if (G.autoFw <= 0) {
    const calm = Gift.open;
    G.autoFw = calm ? rand(1.3, 2.4) : (G.partyT < 3 ? rand(0.25, 0.5) : rand(0.5, 1.1));
    const type = Math.random() < 0.22 ? 'heart' : undefined;
    FX.launch({ type });
    if (!calm && Math.random() < 0.3) setTimeout(() => { if (G.state === 'party') FX.launch({ small: true }); }, 160);
  }
  // happy hops
  const d = G.dino;
  if (d.onGround && G.partyT > 1 && (G.partyT % 1.6) < dt) { d.vy = -380; d.onGround = false; }
}

/* =====================================================================
   RENDER

const STARS = (() => { const r = seeded(42); return Array.from({ length: 110 }, () => ({ x: r(), y: r() * 0.75, s: 0.6 + r() * 1.6, p: r() * TAU })); })();
const CLOUDS = (() => { const r = seeded(3); return Array.from({ length: 9 }, (_, i) => ({ x: i * 340 + r() * 200, y: 30 + r() * 120, s: 0.7 + r() * 0.7 })); })();

const SKY_KEYS = [
  [0.00, '#6cc8ff', '#d9f3ff'],
  [0.40, '#ffa38f', '#ffe0a3'],
  [0.68, '#7a4f9e', '#ff9aa8'],
  [0.92, '#151446', '#3d2b72'],
  [1.00, '#120f3a', '#33266a'],

function skyColors(p) {
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    if (p <= b[0]) { const t = (p - a[0]) / (b[0] - a[0]); return [mixHex(a[1], b[1], t), mixHex(a[2], b[2], t)]; }
  }
  const l = SKY_KEYS[SKY_KEYS.length - 1]; return [l[1], l[2]];
}
const BASE = {
  hillFar: '#a6e3a0', hillNear: '#74cc78', grass: '#6ccf55', grassDark: '#4fae42', dirt: '#b77a4d', dirtDark: '#9a6340',
  water: '#4bb8e8', waterTop: '#a8e6ff', cloud: '#ffffff', post: '#8a5a3b', board: '#fff3dd', boardInk: '#4a2f22',
  frost: '#ff7aa8', sponge: '#ffe2b0', jam: '#e8456f', flower1: '#ff6f9f', flower2: '#ffd44d', flower3: '#b88cff',

function render() {
  const { dpr, S, vw, vh } = view;
  const c = ctx;
  const d = G.dino;
  const p = clamp((d.x - LEVEL.startX) / (LEVEL.stopX - LEVEL.startX), 0, 1);
  const night = smooth(0.55, 0.97, p);

  // ---- sky (view units)

  sg.addColorStop(0, top); sg.addColorStop(1, bot);
  c.fillStyle = sg; c.fillRect(0, 0, vw, vh);

  // stars
  const starA = smooth(0.62, 0.95, p);
  if (starA > 0) {
    c.fillStyle = '#fffbe8';

    c.fillStyle = sc; c.beginPath(); c.arc(sx, sy, 30, 0, TAU); c.fill();

  const yOff = -(G.camY + view.groundAt); // vertical camera shift

    c.beginPath(); c.moveTo(0, vh);
    for (let x = 0; x <= vw + 16; x += 16) {

  };
  hill(0.18, pal.hillFar, 34, 70, 0.0042, 0.0113);
  hill(0.42, pal.hillNear, 26, 30, 0.0061, 0.0157);

  // ---- world
  c.setTransform(dpr * S, 0, 0, dpr * S, -G.camX * dpr * S, -G.camY * dpr * S);
  const x0 = G.camX - 60, x1 = G.camX + vw + 60;
  const bottom = G.camY + vh + 10;

  // water band
  c.fillStyle = pal.water; c.fillRect(x0, WATER_Y, x1 - x0, bottom - WATER_Y);
  c.fillStyle = pal.waterTop;
  c.beginPath(); c.moveTo(x0, WATER_Y + 6);
  for (let x = Math.floor(x0 / 12) * 12; x <= x1; x += 12) c.lineTo(x, WATER_Y + Math.sin(x * 0.08 + G.T * 3) * 2.5);
  c.lineTo(x1, WATER_Y + 6); c.closePath(); c.fill();

  for (const s of LEVEL.solids) {

    const L = Math.max(s.x0, x0 - 20), R = Math.min(s.x1, x1 + 20);
    c.fillStyle = pal.dirt; rr(c, s.x0, s.y, s.x1 - s.x0, bottom - s.y + 40, 10); c.fill();
    c.fillStyle = pal.dirtDark;
    for (let yy = s.y + 30; yy < bottom; yy += 34) {
      for (let x = Math.ceil(L / 46) * 46; x < R - 10; x += 46) {
        const o = ((x / 46) | 0) % 2 ? 18 : 0;
        if (x + o + 14 < s.x1 - 6 && x + o > s.x0 + 6) { c.beginPath(); c.ellipse(x + o, yy + ((x * 7) % 9), 7, 4, 0, 0, TAU); c.fill(); }
      }
    }
    c.fillStyle = pal.grass; rr(c, s.x0 - 3, s.y - 4, s.x1 - s.x0 + 6, 16, 8); c.fill();
    c.fillStyle = pal.grassDark;
    c.beginPath();
    for (let x = Math.ceil(L / 14) * 14; x < R - 6; x += 14) { c.moveTo(x, s.y + 12); c.arc(x + 7, s.y + 12, 7, Math.PI, 0, true); }
    c.fill();
  }

  // floating cake platforms
  const fp = night > 0 ? tintPalette(BASE, NIGHT, night * 0.25) : pal;
  for (const f of LEVEL.floats) {
    if (f.x1 < x0 || f.x0 > x1) continue;
    const w = f.x1 - f.x0;
    if (night > 0.2) { c.fillStyle = `rgba(255,220,180,${0.2 * night})`; rr(c, f.x0 - 6, f.y - 7, w + 12, 38, 14); c.fill(); }
    c.fillStyle = fp.sponge; rr(c, f.x0, f.y, w, 24, 8); c.fill();
    c.fillStyle = fp.jam; c.fillRect(f.x0 + 4, f.y + 14, w - 8, 3);
    c.fillStyle = fp.frost;
    c.beginPath(); c.moveTo(f.x0, f.y + 8);
    c.arcTo(f.x0, f.y - 1, f.x0 + 8, f.y - 1, 8); c.lineTo(f.x1 - 8, f.y - 1); c.arcTo(f.x1, f.y - 1, f.x1, f.y + 8, 8);
    const n = Math.max(3, Math.round(w / 24));
    for (let i = n; i > 0; i--) {
      const px = f.x0 + (w * i) / n, qx = f.x0 + (w * (i - 1)) / n;
      c.lineTo(px, f.y + 8);
      c.quadraticCurveTo((px + qx) / 2, f.y + 8 + 6 + (i % 3) * 3, qx, f.y + 8);
    }
    c.closePath(); c.fill();
    c.fillStyle = '#ffffff';
    for (let i = 0; i < n; i++) { c.beginPath(); c.arc(f.x0 + 12 + (i * (w - 24)) / Math.max(1, n - 1), f.y + 2, 1.8, 0, TAU); c.fill(); }
  }

  // balloon bridges
  const bcols = ['#ff4f8b', '#ffd44d', '#5fd0ff', '#6ee07a', '#9b7bff', '#ff8a3d'];
  for (const b of G.bridges) {
    if (b.x1 < x0 || b.x0 > x1) continue;

    const age = clamp((G.T - b.born) / 0.8, 0, 1);
    const n = Math.ceil((b.x1 - b.x0) / 24);
    for (let i = 0; i <= n; i++) {

      c.fillStyle = bcols[i % bcols.length];
      c.beginPath(); c.ellipse(bx, by, 12, 14, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(bx - 4, by - 5, 3, 4.5, -0.4, 0, TAU); c.fill();
    }
  }

      c.fillStyle = o.hue < 0.33 ? pal.flower1 : o.hue < 0.66 ? pal.flower3 : '#ffffff';
      for (let k = 0; k < 5; k++) { const a = (k / 5) * TAU + o.hue; c.beginPath(); c.arc(o.x + Math.cos(a) * 4 * o.s, o.y - 16 * o.s + Math.sin(a) * 4 * o.s, 3.2 * o.s, 0, TAU); c.fill(); }
      c.fillStyle = pal.flower2; c.beginPath(); c.arc(o.x, o.y - 16 * o.s, 2.6 * o.s, 0, TAU); c.fill();
    } else {

    rr(c, sgn.x - bw / 2, by, bw, bh, 7); c.fill();

      c.fillStyle = g; c.beginPath(); c.arc(h.x, yb, 26, 0, TAU); c.fill();
    }
    c.fillStyle = '#ff3f7f'; heartPath(c, h.x, yb, 13 * pul); c.fill();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(h.x - 5 * pul, yb - 5 * pul, 2.6, 1.8, -0.6, 0, TAU); c.fill();
  }

  // dino
  if (d.visible && !(G.state === 'fall' && d.y > WATER_Y + 4)) {
    const blinkReady = G.state === 'ready' && Math.sin(G.T * 10) > 0.6;

  }

  // speech bubble
  drawBubble(c);

  // ---- screen-space overlays
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  FX.drawConfetti(c);
  drawHUD(c, p);
}

function drawPartyZone(c, pal, night, x0, x1) {
  const [b0, b1] = LEVEL.bunting;

  c.fillStyle = pal.post;

        c.fillStyle = `rgba(255,226,140,${night * on})`; c.beginPath(); c.arc(lx, ly, 2.6, 0, TAU); c.fill();
        c.fillStyle = `rgba(255,226,140,${0.18 * night * on})`; c.beginPath(); c.arc(lx, ly, 9, 0, TAU); c.fill();
      }
    }
  });
  // balloon cluster tied near the cake
  const bx = LEVEL.cakeX - 150;
  const bcols = ['#ff4f8b', '#ffd44d', '#5fd0ff', '#9b7bff', '#6ee07a'];
  bcols.forEach((col, i) => {

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  Gift.tick(dt);
}

function update(dt) {
  G.T += dt;
  const d = G.dino;

  if (G.state === 'run' || G.state === 'arrive' || G.state === 'party' || G.state === 'fall' || G.state === 'ready' || G.state === 'intro') {
    if (G.state === 'run' || G.state === 'arrive' || (G.state === 'party' && !d.onGround)) {
      const n = Math.max(1, Math.ceil(dt / (1 / 240)));
      for (let i = 0; i < n; i++) {
        if (G.state === 'party') {
          const prev = d.y; d.vy += GRAV * (dt / n); d.y += d.vy * (dt / n);
          if (d.vy >= 0 && prev <= 0.6 && d.y >= 0) { d.y = 0; d.vy = 0; d.onGround = true; d.sq = 0.85; }
        } else step(dt / n);
      }
    }
  }
  if (G.state === 'fall') {
    G.fallT += dt;
    d.vy += GRAV * 0.25 * dt; d.y += Math.min(d.vy, 300) * dt;
    if (G.fallT > 1.0) respawn();
  }
  if (G.state === 'party') updateParty(dt);

  // run animation
  if ((G.state === 'run' || G.state === 'arrive') && d.onGround && !d.blocked) {
    const spdNow = G.state === 'arrive' ? Math.max(60, SPEED * 0.6) : SPEED;
    d.run += dt * spdNow * 0.075;
    G.nextDust -= dt;
    if (G.nextDust <= 0) { G.nextDust = 0.13; G.parts.push({ x: d.x - 12, y: d.y - 2, vx: rand(-40, -10), vy: rand(-30, -5), life: 0.35, max: 0.35, r: rand(2, 4), kind: 'dust' }); }
  } else if (d.blocked) d.run += dt * 6;
  d.sq = lerp(d.sq, 1, 1 - Math.exp(-dt * 12));
  d.blinkT -= dt;
  if (d.blinkT <= 0) { d.blink = !d.blink; d.blinkT = d.blink ? 0.12 : rand(1.8, 4); }

  // hearts
  if (G.state === 'run' || G.state === 'arrive') {
    const cx = d.x + 4, cy = d.y - 26;
    for (const h of LEVEL.hearts) {
      if (h.got || Math.abs(h.x - cx) > 40) continue;
      if (Math.hypot(h.x - cx, h.y - cy) < 32) { h.got = true; G.hearts++; Sound.heart(); sparkle(h.x, h.y, '#ff6f9f'); }
    }
  }
  updateParts(dt);

  // distant fireworks near the end of the level
  if (G.state === 'run' && d.x > LEVEL.stopX - 2400 && Math.random() < dt * 0.6) FX.launch({ small: true, ty: rand(view.cssH * 0.08, view.cssH * 0.3) });
  FX.update(dt);

  // camera
  const targetX = d.x - view.vw * 0.28;
  if (G.state === 'party') G.camX = lerp(G.camX, LEVEL.stopX - view.vw * 0.36, 1 - Math.exp(-dt * 2));
  else G.camX = targetX;
  const ground = d.onGround ? d.y : (d.surf ? d.surf.y : 0);
  let want = -view.groundAt + Math.min(0, ground + 40);
  if (G.state === 'fall') want = G.camY;
  if (G.state === 'party') want = -(view.vh - Math.max(34, view.vh * 0.09));
  G.camY = lerp(G.camY, want, 1 - Math.exp(-dt * 4));
  const topNeeded = d.y - DINO_H - 70;
  if (G.state !== 'fall' && topNeeded < G.camY) G.camY = topNeeded;
}

    const [main, ...rest] = String(text || '').split('\n');
    el.append(main);
    if (rest.length) { const sub = document.createElement('span'); sub.className = 'caption-sub'; sub.textContent = rest.join(' '); el.appendChild(sub); }
  }
  function setCaption(text) { if (capEl) fillCaption(capEl, text); }

  function buildSlides(media) {
    const out = media.map((m, i) => ({ ...m, caption: CONFIG.captions[i] || '' }));
    if (!out.length) out.push({ kind: 'scene', scene: 'flowers' }, { kind: 'scene', scene: 'balloons' }, { kind: 'scene', scene: 'gift' });
    out.push({ kind: 'scene', scene: 'cake' });
    return out;
  }

  function sceneSize() {
    const maxW = Math.min(view.cssW * 0.84, 900);
    const maxH = view.cssH - (view.cssH < 520 ? 150 : 235) - sceneExtra;
    let w = maxW, h = w * 0.75;
    if (h > maxH) { h = maxH; w = h / 0.75; }
    return [Math.max(160, Math.floor(w)), Math.max(120, Math.floor(h))];
  }

  function stopCurrent() {
    clearTimeout(autoT); autoT = null;
    if (current && current.kind === 'video') {
      video.pause(); video.onended = null; video.onerror = null;
      video.removeAttribute('src'); try { video.load(); } catch (e) {}
      Music.duck(false);
      Sound.setFireworkVolume(open ? 0.35 : 1);
    }
    sceneState = null; sceneCanvas = null;
  }

  function show(i) {
    stopCurrent();
    idx = clamp(i, 0, slides.length - 1);
    const sl = slides[idx];
    current = sl;
    stage.querySelectorAll('.polaroid.out').forEach((el) => el.remove());
    const old = stage.querySelector('.polaroid');
    if (old) { old.classList.add('out'); setTimeout(() => old.remove(), 300); }
    const card = document.createElement('div');
    card.className = 'polaroid';
    card.style.setProperty('--tilt', tilts[idx % tilts.length]);
    const wrap = document.createElement('div'); wrap.className = 'media-wrap';
    const box = document.createElement('div'); box.className = 'media';
    wrap.appendChild(box);
    const cap = document.createElement('p'); cap.className = 'caption'; capEl = cap;
    card.append(wrap, cap);
    stage.appendChild(card);

    if (sl.kind === 'image') {
      const img = new Image(); img.alt = sl.caption || 'Фото'; img.decoding = 'async';
      img.className = 'kb';
      const dur = CONFIG.slideSeconds;
      img.style.setProperty('--dur', dur + 1 + 's');
      img.style.setProperty('--ox', ['30%', '70%', '50%', '40%'][idx % 4]); img.style.setProperty('--oy', ['40%', '60%', '30%', '50%'][idx % 4]);
      img.onerror = () => { if (current === sl) { clearTimeout(autoT); autoT = setTimeout(() => next(), 300); } };
      img.src = sl.src;
      box.appendChild(img);
      fillCaption(cap, sl.caption);
      autoT = setTimeout(() => next(), dur * 1000);
    } else if (sl.kind === 'video') {
      box.appendChild(video);
      fillCaption(cap, sl.caption);
      Music.duck(true);
      Sound.setFireworkVolume(0);
      video.muted = Sound.muted;
      video.onended = () => next();
      video.onerror = () => { autoT = setTimeout(() => next(), 1500); };
      video.src = sl.src;
      const p = video.play();
      if (p && p.catch) p.catch((err) => {
        // Only a real autoplay refusal on the slide that is still showing; load errors go to onerror.
        if (current !== sl || !err || err.name !== 'NotAllowedError') return;
        // Browser refused sound without a tap: play muted and offer a button.
        video.muted = true;
        video.play().catch(() => {});
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn'; b.id = 'unmuteVideo'; b.textContent = 'Включить звук';
        b.addEventListener('click', (e) => { e.stopPropagation(); video.muted = Sound.muted; video.play().catch(() => {}); b.remove(); });
        wrap.appendChild(b);
      });
    } else {
      const sc = SCENES[sl.scene];
      const cv = document.createElement('canvas');
      sceneExtra = sc.caption.includes('\n') ? 26 : 0;
      const [w, h] = sceneSize();
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      cv.width = Math.round(w * Math.min(2, window.devicePixelRatio || 1)); cv.height = Math.round(h * Math.min(2, window.devicePixelRatio || 1));
      box.appendChild(cv);
      sceneCanvas = cv;
      sceneState = { t: 0, sc };
      sc.init(sceneState);
      fillCaption(cap, sc.caption);
      if (sc.tap) {
        cv.style.cursor = 'pointer';
        cv.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); Sound.init(); if (sceneState && sceneState.sc === sc) sc.tap(sceneState, sceneState.t); });
      }
      if (sc.dur) autoT = setTimeout(() => next(), sc.dur * 1000);
      else if (sl.scene === 'gift') autoT = setTimeout(() => { if (sceneState && sceneState.sc === sc) sc.tap(sceneState, sceneState.t); }, 6500);
    }
    refreshNav();
  }

  function refreshNav() {
    dotsEl.textContent = '';
    slides.forEach((_, k) => { const d = document.createElement('i'); if (k === idx) d.className = 'on'; dotsEl.appendChild(d); });
    $('#prevBtn').disabled = idx === 0;
    $('#prevBtn').style.opacity = idx === 0 ? 0.35 : 1;
    $('#nextBtn').style.visibility = idx === slides.length - 1 ? 'hidden' : 'visible';
  }

  function next(manual) {
    if (!open) return;
    if (idx < slides.length - 1) show(idx + 1);
    else if (!manual) clearTimeout(autoT);
  }
  function prev() { if (open && idx > 0) show(idx - 1); }

  function showEnd() {
    if (finished) return;
    finished = true;
    const nav = $('#giftNav');
    const box = document.createElement('div'); box.className = 'end-actions'; box.id = 'endActions';
    const again = document.createElement('button'); again.type = 'button'; again.className = 'btn'; again.textContent = 'Сыграть ещё раз';
    again.addEventListener('click', () => { Gift.close(); restart(); });
    const replay = document.createElement('button'); replay.type = 'button'; replay.className = 'btn ghost'; replay.textContent = 'Смотреть с начала';
    replay.addEventListener('click', () => { finished = false; box.remove(); $('#giftNav').hidden = false; show(0); });
    box.append(again, replay);
    nav.hidden = true;
    nav.after(box);
  }

  // swipe on the photo
  let sx = null;
  root.addEventListener('pointerdown', (e) => { sx = e.clientX; }, true);
  root.addEventListener('pointercancel', () => { sx = null; });
  root.addEventListener('pointerup', (e) => {
    if (sx == null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 50) { if (dx < 0) next(true); else prev(); }
  });

  $('#nextBtn').addEventListener('click', (e) => { e.currentTarget.blur(); next(true); });
  $('#prevBtn').addEventListener('click', (e) => { e.currentTarget.blur(); prev(); });

  return {
    get open() { return open; },
    async start() {
      if (open) return;
      open = true; finished = false;
      const end = $('#endActions'); if (end) end.remove();
      $('#giftNav').hidden = false;
      $('#party').hidden = true;
      root.hidden = false;
      Sound.setFireworkVolume(0.35);
      // play() for the first video has to happen inside this tap on iPhone
      video.muted = true; const pv = video.play(); if (pv && pv.catch) pv.catch(() => {});
      stage.textContent = '';
      const media = MediaFinder.list || await Promise.race([MediaFinder.find(), new Promise((r) => setTimeout(() => r(MediaFinder.found.slice()), 2500))]);
      if (!open) return;
      slides = buildSlides(media || []);
      show(0);
      if (!MediaFinder.list) {
        // The folder search is still running (slow disk or a quick finale): add late photos before the cake.
        const shown = media.length;
        MediaFinder.find().then((all) => {
          if (!open || all.length <= shown) return;
          if (!shown) { slides = buildSlides(all); show(0); return; } // real photos replace the built-in cards
          const cakeAt = slides.length - 1;
          slides.splice(cakeAt, 0, ...all.slice(shown).map((m, i) => ({ ...m, caption: CONFIG.captions[shown + i] || '' })));
          if (idx !== cakeAt) refreshNav();
          else if (finished) { idx = slides.length - 1; refreshNav(); }
          else show(cakeAt);
        });
      }
    },
    close(backToParty) {
      open = false;
      stopCurrent();
      root.hidden = true; stage.textContent = '';
      const end = $('#endActions'); if (end) end.remove();
      $('#giftNav').hidden = false;
      Sound.setFireworkVolume(1);
      if (backToParty && G.state === 'party') $('#party').hidden = false;
    },
    next, prev,
    tick(dt) {
      if (!open || !sceneState || !sceneCanvas) return;
      sceneState.t += dt;
      const cv = sceneCanvas, c = cv.getContext('2d');
      const w = parseFloat(cv.style.width), h = parseFloat(cv.style.height);
      const k = cv.width / w;
      // scenes are drawn in a 640x480 design space
      const sx2 = (w / 640) * k, sy2 = (h / 480) * k;
      c.setTransform(sx2, 0, 0, sy2, 0, 0);
      sceneState.sc.draw(c, 640, 480, sceneState.t, sceneState);
    },
    resize() {
      if (!sceneCanvas) return;
      const [w, h] = sceneSize(); const k = Math.min(2, window.devicePixelRatio || 1);
      sceneCanvas.style.width = w + 'px'; sceneCanvas.style.height = h + 'px';
      sceneCanvas.width = Math.round(w * k); sceneCanvas.height = Math.round(h * k);
    },
    pauseForHidden() { if (current && current.kind === 'video' && open) video.pause(); },
    resumeFromHidden() { if (current && current.kind === 'video' && open) video.play().catch(() => {}); },
    setMuted(m) { video.muted = m; },
  };
})();

/* =====================================================================
   FLOW
   ===================================================================== */
function startGame() {
  Sound.init();
  Music.bless();
  $('#intro').hidden = true;
  resetGame();
  if (location.hash === '#finale') {
    const d = G.dino; d.x = LEVEL.arriveX - 700; G.checkpoint = LEVEL.solids[LEVEL.solids.length - 1];
  }
  G.state = 'run';
  canvas.focus({ preventScroll: true });
}
function restart() {
  Music.stop();
  $('#party').hidden = true;
  resetGame();
  G.state = 'ready';
  G.bubble = { text: 'Нажми, чтобы бежать!', t: G.T, dur: 99 };
}

$('#startBtn').addEventListener('click', (e) => { e.currentTarget.blur(); startGame(); });
$('#giftBtn').addEventListener('click', (e) => { e.currentTarget.blur(); Sound.init(); Gift.start(); });

const muteBtn = $('#mute');
function syncMute() {
  const m = Sound.muted;
  muteBtn.setAttribute('aria-label', m ? 'Включить звук' : 'Выключить звук');
  muteBtn.querySelector('.waves').style.display = m ? 'none' : '';
  muteBtn.querySelector('.cross').style.display = m ? '' : 'none';
}
muteBtn.addEventListener('click', (e) => {
  e.currentTarget.blur();
  Sound.init();
  Sound.setMuted(!Sound.muted);
  Music.setMuted(Sound.muted);
  Gift.setMuted(Sound.muted);
  syncMute();
});
syncMute();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    Sound.suspend(); Music.pauseForHidden(); Gift.pauseForHidden();
    if (G.state === 'run') { G.state = 'ready'; G.jumpBuf = 0; G.bubble = { text: 'Пауза. Нажми, чтобы бежать дальше', t: G.T, dur: 99 }; }
  }
  else { Sound.resume(); Music.resumeFromHidden(); Gift.resumeFromHidden(); last = performance.now(); }
});

if (document.fonts && document.fonts.load) {
  ['400 1em Bungee', '700 1em Caveat', '800 1em Nunito', '900 1em Nunito'].forEach((f) => document.fonts.load(f).catch(() => {}));
}
window.addEventListener('resize', resize);
resetGame();
resize();
G.camX = G.dino.x - view.vw * 0.28;
MediaFinder.find();
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
</body>
</html>
